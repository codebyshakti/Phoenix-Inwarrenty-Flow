name : Postman Collection Workflow

on: 
  push:
    branches: [main]
  workflow_dispatch: 
  schedule:
    - cron : 30 02 * * * #8 am IST Every day
    - cron : 00 14 * * * #7:30 pm IST Every day
    - cron : 00 06 * * 1-5 

jobs:
  run-postman-tests: 
    runs-on: ubuntu-latest

    steps: 
      - name: checkout the code
        uses: actions/checkout@v6.1.0

      - name: Install Nodejs and npm
        uses: actions/setup-node@v6.5.0
        with:
          node-version: '22'

      - name: Install Newman and Html-extra globally
        run: |
             npm install -g newman
             npm install -g newman-reporter-htmlextra

      - name: Run the Postman Collection with newman
        run: |
             newman run 'Inwarrenty-flow Collection.postman_collection.json' \
             -e QA.postman_environment.json \
             -d testdata.csv \
             -r cli,htmlextra

      - name: Newman Report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Newman Report
          path: newman/*.html
        
      
    
